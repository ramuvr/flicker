# Test on every push/PR; deploy to Azure App Service on push to main.
# Setup (one time) is described in README.md under "Automatic deployment from GitHub".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  deploy:
    needs: test
    # Skipped (not failed) until the Azure settings are added; see README.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OpenID Connect: short-lived Azure token, no stored password
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Ship only what runs in production: the server, the web files and locked
      # production dependencies (no tests, docs or workflow files).
      - name: Build deployment package
        run: |
          mkdir dist
          cp -r server.js package.json package-lock.json public dist/
          npm ci --omit=dev --prefix dist
      - id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: dist
      # Fail the run if the deployed app does not answer correctly. /healthz returns 200
      # only when the bot check can issue a challenge (startup settings validated).
      - name: Smoke test the deployed app
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          set -euo pipefail
          check() { curl -fsS -o /dev/null --retry 12 --retry-delay 10 --retry-all-errors -w "%{http_code} $1\n" "$APP_URL$1"; }
          check /healthz
          check /
          check /privacy
          curl -fsS -D - -o /dev/null "$APP_URL/" | grep -qi "^content-security-policy: default-src 'none'"
          curl -fsS "$APP_URL/api/challenge" | grep -q '"signature"'
          echo "Smoke test passed for $APP_URL"
